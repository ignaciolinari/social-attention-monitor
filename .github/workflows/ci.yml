name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install -e .

      - name: Lint (ruff check)
        run: ruff check src tests

      - name: Format check (ruff format)
        run: ruff format --check src tests

      - name: Type check (mypy)
        run: mypy src/sam/ --ignore-missing-imports

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install -e .

      - name: Tests (pytest)
        run: pytest tests/ -v --cov=src/sam --cov-report=xml --cov-report=term


  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install -e .

      - name: Security audit (pip-audit runtime lockfile)
        run: pip-audit -r requirements.lock

      - name: Security audit (pip-audit dev lockfile)
        run: pip-audit -r requirements-dev.lock

  smoke-test:
    name: End-to-End Smoke Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: sam
          POSTGRES_USER: sam
          POSTGRES_PASSWORD: sam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sam -d sam"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install -e .

      - name: Run database migrations
        env:
          DATABASE_SYNC_URL: postgresql://sam:sam@localhost:5432/sam
        run: alembic -c alembic.ini upgrade head

      - name: Start API server
        env:
          DATABASE_URL: postgresql+asyncpg://sam:sam@localhost:5432/sam
          REDIS_URL: redis://localhost:6379
          SAM_DEMO_MODE: "true"
        run: uvicorn sam.api.main:app --host 0.0.0.0 --port 8000 &

      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health >/dev/null 2>&1; then
              echo "API ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to become ready"
          exit 1

      - name: Health check
        run: |
          curl -sf http://localhost:8000/health | jq .
          echo "Health check passed!"

      - name: Pipeline health check
        run: |
          curl -sf http://localhost:8000/api/v1/pipeline/health | jq .
          echo "Pipeline health check passed!"

      - name: Titles endpoint check
        run: |
          curl -sf http://localhost:8000/api/v1/db/titles | jq .
          echo "Titles endpoint check passed!"

      - name: Alerts endpoint check
        run: |
          curl -sf http://localhost:8000/api/v1/alerts | jq .
          echo "Alerts endpoint check passed!"

      - name: Sentiment analysis check
        run: |
          curl -sf "http://localhost:8000/api/v1/sentiment/analyze?text=This%20movie%20is%20amazing" | jq .
          echo "Sentiment analysis check passed!"

      - name: WebSocket status check
        run: |
          curl -sf http://localhost:8000/api/v1/ws/status | jq .
          echo "WebSocket status check passed!"

      - name: Box Office endpoint check
        run: |
          curl -sf http://localhost:8000/api/v1/metrics/box-office | jq .
          echo "Box Office endpoint check passed!"

      - name: Watchlists endpoint check
        run: |
          curl -sf http://localhost:8000/api/v1/watchlists | jq .
          echo "Watchlists endpoint check passed!"

      - name: Benchmark endpoint check (expects 422 without params)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/v1/metrics/benchmark)
          if [ "$STATUS" = "422" ]; then echo "Benchmark endpoint loaded (422 as expected)"; else echo "Unexpected status $STATUS"; exit 1; fi

      - name: Seed test data for benchmark
        env:
          DATABASE_URL: postgresql+asyncpg://sam:sam@localhost:5432/sam
          DATABASE_SYNC_URL: postgresql://sam:sam@localhost:5432/sam
          REDIS_URL: redis://localhost:6379
          SAM_DEMO_MODE: "true"
        run: python -m sam.scheduler.runner --once --limit-titles 2

      - name: Benchmark positive test (with valid title_id)
        run: |
          TITLE_ID=$(curl -sf http://localhost:8000/api/v1/db/titles | jq -r '.titles[0].id // empty')
          if [ -n "$TITLE_ID" ]; then
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8000/api/v1/metrics/benchmark?title_id=$TITLE_ID")
            if [ "$STATUS" = "200" ]; then
              echo "Benchmark positive test passed (200)"
            else
              echo "Benchmark returned $STATUS for valid title_id (may be 400 if no release_date)"
              [ "$STATUS" = "400" ] || exit 1
            fi
          else
            echo "No titles available, skipping benchmark positive test"
          fi

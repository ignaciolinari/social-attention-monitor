[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "social-attention-monitor"
version = "0.3.0"
description = "Real-time social attention monitoring for film & TV releases"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Ignacio Linari" }
]
keywords = ["social-media", "sentiment-analysis", "data-pipeline", "streaming"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # API Clients
    "praw>=7.7.0",                    # Reddit API
    "google-api-python-client>=2.0",  # YouTube API
    "httpx>=0.27.0",                  # Async HTTP client (TMDB, etc.)
    "atproto>=0.0.55",                # Bluesky API

    # Database
    "sqlalchemy[asyncio]>=2.0",       # ORM
    "asyncpg>=0.29.0",                # PostgreSQL async driver
    "alembic>=1.13.0",                # Migrations
    "psycopg2-binary>=2.9.0",         # PostgreSQL sync driver (for alembic)

    # Data Processing
    "pandas>=2.0",                    # Data manipulation
    "numpy>=1.26",                    # Numerical operations

    # NLP & Sentiment
    "vaderSentiment>=3.3.2",          # Baseline sentiment analysis
    "nltk>=3.8",                      # Text preprocessing

    # API Server
    "fastapi>=0.109.0",               # Web framework
    "uvicorn[standard]>=0.27.0",      # ASGI server
    "pydantic>=2.0",                  # Data validation
    "pydantic-settings>=2.0",         # Environment config

    # Caching & Queue
    "redis>=5.0",                     # Cache and message queue

    # Scheduling
    "apscheduler>=3.10.0",            # Job scheduling

    # Dashboard
    "streamlit>=1.30.0",              # Dashboard UI
    "plotly>=5.18.0",                 # Interactive charts
    "altair>=5.0",                    # Declarative charts
    "streamlit-autorefresh>=1.0.1",   # Auto-refresh component

    # Utilities
    "python-dotenv>=1.0",             # Environment loading
    "loguru>=0.7.0",                  # Better logging
    "tenacity>=8.2.0",                # Retry logic
    "arrow>=1.3.0",                   # Date/time handling
    "langdetect>=1.0.9",              # Language detection for translation gating
    "rapidfuzz>=3.0",                 # Fast fuzzy string matching
    "yake>=0.4.8",                    # Keyword extraction
    "wordcloud>=1.9.0",               # Word cloud generation
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "httpx>=0.27.0",                  # For testing API
    "respx>=0.21.0",                  # HTTPX mocking
    "factory-boy>=3.3.0",             # Test fixtures
    "pip-audit>=2.9.0",               # Dependency vulnerability scan
    "uv>=0.5.0",                      # Lockfile / fast installer
]

transformers = [
    "transformers>=4.37.0",           # Transformer models
    "torch>=2.0",                     # PyTorch backend
    "scipy>=1.10.0",                  # Required for softmax in sentiment
]


[project.scripts]
sam = "sam.cli:main"

[project.urls]
Repository = "https://github.com/ignaciolinari/social-attention-monitor"

[tool.hatch.build.targets.wheel]
# Dashboard lives in src/dashboard/ and is run via `streamlit run` or Docker
# COPY — it does not need to be in the wheel.
packages = ["src/sam"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]
exclude = [
    "src/sam/storage/migrations/**",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["sam"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
exclude = [
    "src/sam/storage/migrations/.*",
]
# Note: src/dashboard/ is intentionally excluded from mypy scope.
# Streamlit has limited type stub coverage and strict mode produces
# excessive noise. Dashboard correctness is validated via integration
# tests and manual UI testing.

[[tool.mypy.overrides]]
module = [
    "praw.*",
    "prawcore",
    "prawcore.*",
    "atproto",
    "atproto.*",
    "vaderSentiment.*",
    "nltk",
    "nltk.*",
    "apscheduler.*",
    "pandas.*",
    "plotly.*",
    "streamlit.*",
    "streamlit_autorefresh",
    "langdetect",
    "scipy.special",
    "rapidfuzz.*",
    "yake",
    "wordcloud",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=sam --cov-report=term-missing"
